[project]
name = "fbpost"
version = "0.4.0"
description = "Facebook CLI tool — post, list comments, reply to comments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.49.0",
    "playwright-stealth>=1.0.6",
    "python-dotenv>=1.2.2",
    "requests>=2.32.5",
]

[project.scripts]
fb = "scripts.fb:main"

[tool.setuptools]
packages = ["scripts"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true
